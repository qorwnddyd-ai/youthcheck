<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>청소년부 출석 현황</title>
    <style>
        :root { --primary: #4A90E2; --present: #2ecc71; --late: #f1c40f; --absent: #e74c3c; --bg: #F2F5F9; --card: #FFFFFF; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; margin: 0; background: var(--bg); color: #2D3436; -webkit-tap-highlight-color: transparent; }
        
        /* 헤더: 투명도 있는 블러 효과 */
        header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 10px rgba(0,0,0,0.02); position: sticky; top:0; z-index:100; }
        header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; color: #1e272e; }
        .btn-link { background: var(--primary); color: white; padding: 10px 16px; border-radius: 12px; text-decoration: none; font-size: 0.85rem; font-weight: bold; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3); }

        /* 통계 위젯 디자인 */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px; }
        .stat-card { background: var(--card); padding: 18px 10px; border-radius: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.8); }
        .stat-card span { display: block; font-size: 0.75rem; color: #7f8c8d; margin-bottom: 6px; font-weight: 600; }
        .stat-card strong { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

        .date-picker { padding: 0 20px 20px; }
        input[type="date"] { padding: 12px; border-radius: 14px; border: 1px solid #E0E6ED; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; background: white; color: #2D3436; }

        /* 탭: 언더라인 스타일 */
        .tab-container { display: flex; overflow-x: auto; padding: 0 20px; gap: 15px; background: transparent; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
        .tab-container::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 4px; border: none; background: transparent; white-space: nowrap; flex-shrink: 0; font-size: 0.95rem; color: #A4B0BE; font-weight: 700; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .list { padding: 10px 20px 40px; display: grid; gap: 12px; }
        .card { background: var(--card); padding: 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.2s; }
        .name { font-weight: 700; font-size: 1.05rem; color: #2D3436; }
        
        .badge { padding: 6px 14px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; background: #F1F3F5; color: #A4B0BE; }
        .badge.출석 { background: #E8F9EE; color: var(--present); }
        .badge.지각 { background: #FFF9DB; color: var(--late); }
        .badge.결석 { background: #FFF5F5; color: var(--absent); }
    </style>
</head>
<body>
    <header><h1>📋 청소년부 현황</h1><a href="check.html" class="btn-link">기록하기 ➔</a></header>
    
    <div class="stats">
        <div class="stat-card"><span>전체</span><strong id="total">0</strong></div>
        <div class="stat-card" style="color:var(--present)"><span>출석</span><strong id="present">0</strong></div>
        <div class="stat-card" style="color:var(--late)"><span>지각</span><strong id="late">0</strong></div>
    </div>

    <div class="date-picker"><input type="date" id="date"></div>
    <div class="tab-container" id="tabs"></div>
    <div id="list" class="list"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://tdlefyjokqpjubdvqdnr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbGVmeWpva3FwanViZHZxZG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyOTgyNDgsImV4cCI6MjA5MDg3NDI0OH0.cJ9E_9afLyUiuWa3TD9pubq2FadcN5_DVFDu_77zyZ4';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let students = []; let teacher = "";
        const dateInput = document.getElementById('date');
        dateInput.value = new Date().toISOString().split('T')[0];

        async function fetchAll() {
            const selectedDate = dateInput.value;
            const { data: studentData } = await db.from('students').select('*');
            const { data: attendanceData } = await db.from('attendance').select('*').eq('date', selectedDate);

            students = studentData.map(student => {
                const record = attendanceData.find(a => a.student_id === student.id);
                return { ...student, status: record ? record.status : null };
            });

            document.getElementById('total').innerText = students.length;
            document.getElementById('present').innerText = students.filter(s => s.status === '출석').length;
            document.getElementById('late').innerText = students.filter(s => s.status === '지각').length;
            
            const teachers = [...new Set(students.map(s => s.grade_class))];
            if (!teacher || !teachers.includes(teacher)) teacher = teachers[0] || "";
            
            render();
        }

        function render() {
            const teachers = [...new Set(students.map(s => s.grade_class))];
            document.getElementById('tabs').innerHTML = teachers.map(t => 
                `<button class="tab-btn ${t===teacher?'active':''}" onclick="teacher='${t}';render()">${t.replace(' 선생님','')}</button>`
            ).join('');
            
            const filtered = students.filter(s => s.grade_class === teacher);
            document.getElementById('list').innerHTML = filtered.map(s => 
                `<div class="card"><span class="name">${s.name}</span><span class="badge ${s.status || ''}">${s.status || '미체크'}</span></div>`
            ).join('');
        }

        dateInput.onchange = fetchAll; 
        fetchAll();
    </script>
</body>
</html>
