<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청소년부 출석 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --ink:#1B2420; --ink-soft:#5C6660; --ink-faint:#9AA39C;
  --paper:#ECEEE9; --surface:#FCFCFA; --surface-2:#F4F5F1;
  --line:#E3E5DF; --line-strong:#D4D8CF;
  --present:#2F7A55; --present-bg:#E7F0EA;
  --late:#A87C24;   --late-bg:#F4ECD6;
  --absent:#A0494B; --absent-bg:#F3E6E5;
  --radius:20px; --radius-sm:13px;
  --shadow:0 1px 2px rgba(27,36,32,.04), 0 10px 30px rgba(27,36,32,.05);
  --serif:'Fraunces',serif;
  --sans:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper)}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 14px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.brand h1{margin:0;font-size:1.18rem;font-weight:800;letter-spacing:-.02em}
.btn-link{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;text-decoration:none;font-size:.84rem;font-weight:700;letter-spacing:-.01em;transition:transform .15s,opacity .15s}
.btn-link:active{transform:scale(.97);opacity:.9}

/* Hero summary — signature */
.hero{margin:6px 16px 4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 24px 20px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hero-date{font-size:.8rem;color:var(--ink-soft);font-weight:600;letter-spacing:-.01em}
.hero-rate{font-size:.78rem;color:var(--ink-faint);font-weight:700}
.hero-rate b{color:var(--present);font-variant-numeric:tabular-nums}
.hero-figure{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px}
.hero-figure .num{font-family:var(--serif);font-size:3.6rem;line-height:.9;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-figure .of{font-family:var(--serif);font-size:1.5rem;color:var(--ink-faint);font-weight:400;font-variant-numeric:tabular-nums}
.hero-figure .cap{margin-left:auto;font-size:.82rem;color:var(--ink-soft);font-weight:600;align-self:flex-end;padding-bottom:6px}
/* segmented bar */
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:16px;gap:2px}
.bar span{display:block;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .s-present{background:var(--present)}
.bar .s-late{background:var(--late)}
.bar .s-absent{background:var(--absent)}
.bar .s-none{background:var(--line-strong)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.legend i{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-soft);font-weight:600;font-style:normal}
.legend i::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--line-strong))}
.legend .l-present{--dot:var(--present)} .legend .l-late{--dot:var(--late)} .legend .l-absent{--dot:var(--absent)} .legend .l-none{--dot:var(--line-strong)}
.legend i b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}

/* Controls */
.controls{padding:14px 20px 6px;display:flex;gap:10px;align-items:center}
.date-field{position:relative;flex:1}
.date-field input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:.92rem;font-weight:600}
.icon-btn{flex-shrink:0;width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:1.1rem;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tabs */
.tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 20px 4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:11px;border:1px solid transparent;background:transparent;white-space:nowrap;flex-shrink:0;font-size:.9rem;color:var(--ink-faint);font-weight:700;cursor:pointer;font-family:inherit;transition:.18s}
.tab.active{color:var(--ink);background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}

/* List */
.list{padding:8px 16px 48px;display:grid;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px 18px;border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.name{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.badge{padding:6px 13px;border-radius:9px;font-weight:700;font-size:.8rem;background:var(--surface-2);color:var(--ink-faint)}
.badge.출석{background:var(--present-bg);color:var(--present)}
.badge.지각{background:var(--late-bg);color:var(--late)}
.badge.결석{background:var(--absent-bg);color:var(--absent)}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,#EDEEE9 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:var(--radius-sm);height:54px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* Empty / error */
.state{margin:8px 16px;padding:40px 24px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--ink-soft)}
.state .ico{font-size:1.8rem;display:block;margin-bottom:10px;opacity:.6}
.state b{display:block;color:var(--ink);font-size:.98rem;margin-bottom:4px}
.state small{font-size:.84rem;color:var(--ink-faint)}
.state button{margin-top:16px;padding:10px 18px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-family:inherit;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">Attendance</span>
      <h1>청소년부 현황</h1>
    </div>
    <a href="check.html" class="btn-link">기록하기 →</a>
  </header>

  <section class="hero" id="hero">
    <div class="hero-top">
      <span class="hero-date" id="hero-date">—</span>
      <span class="hero-rate" id="hero-rate"></span>
    </div>
    <div class="hero-figure">
      <span class="num" id="h-present">0</span>
      <span class="of" id="h-total">/ 0</span>
      <span class="cap">명 출석</span>
    </div>
    <div class="bar" id="bar"><span class="s-none" style="width:100%"></span></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="controls">
    <div class="date-field"><input type="date" id="date"></div>
    <button class="icon-btn" id="refresh" title="새로고침">↻</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list" class="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://tdlefyjokqpjubdvqdnr.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbGVmeWpva3FwanViZHZxZG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyOTgyNDgsImV4cCI6MjA5MDg3NDI0OH0.cJ9E_9afLyUiuWa3TD9pubq2FadcN5_DVFDu_77zyZ4';
const db = window.supabase.createClient(supabaseUrl, supabaseKey);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);

let students = [], teacher = "", loading = false;
const dateInput = $('date');
dateInput.value = new Date().toISOString().split('T')[0];

function fmtDate(str){
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d)) return str;
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. (${days[d.getDay()]})`;
}

function showSkeleton(){
  $('list').innerHTML = Array.from({length:4}).map(()=>'<div class="sk"></div>').join('');
}

function showState(ico, title, desc, retry){
  $('tabs').innerHTML = '';
  $('list').innerHTML = `<div class="state"><span class="ico">${ico}</span><b>${title}</b><small>${desc}</small>${retry?'<br><button id="retry">다시 시도</button>':''}</div>`;
  if (retry) $('retry').onclick = fetchAll;
}

async function fetchAll(){
  if (loading) return;
  loading = true;
  $('refresh').classList.add('spin');
  $('hero-date').textContent = fmtDate(dateInput.value);
  if (!students.length) showSkeleton();

  try{
    const selectedDate = dateInput.value;
    const [{ data: studentData, error: e1 }, { data: attendanceData, error: e2 }] = await Promise.all([
      db.from('students').select('*'),
      db.from('attendance').select('*').eq('date', selectedDate)
    ]);
    if (e1 || e2) throw (e1 || e2);

    const recs = attendanceData || [];
    students = (studentData || []).map(st => {
      const r = recs.find(a => a.student_id === st.id);
      return { ...st, status: r ? r.status : null };
    });

    if (!students.length){
      updateHero();
      showState('🗂️','등록된 학생이 없습니다','관리자 페이지에서 명단을 먼저 추가해 주세요.');
      return;
    }

    const teachers = [...new Set(students.map(s => s.grade_class))];
    if (!teacher || !teachers.includes(teacher)) teacher = teachers[0] || "";
    updateHero();
    render();
  }catch(err){
    console.error(err);
    showState('📡','불러오지 못했습니다','네트워크 연결을 확인하고 다시 시도해 주세요.', true);
    updateHero(true);
  }finally{
    loading = false;
    $('refresh').classList.remove('spin');
  }
}

function updateHero(failed){
  const total = students.length;
  const p = students.filter(s=>s.status==='출석').length;
  const l = students.filter(s=>s.status==='지각').length;
  const a = students.filter(s=>s.status==='결석').length;
  const none = total - p - l - a;

  $('h-present').textContent = failed ? '–' : p;
  $('h-total').textContent = '/ ' + total;
  const checked = p + l + a;
  $('hero-rate').innerHTML = (total && checked) ? `출석률 <b>${Math.round(p/total*100)}%</b>` : '';

  const seg = (cls, n) => n>0 ? `<span class="${cls}" style="width:${n/total*100}%"></span>` : '';
  $('bar').innerHTML = total
    ? seg('s-present',p)+seg('s-late',l)+seg('s-absent',a)+seg('s-none',none)
    : '<span class="s-none" style="width:100%"></span>';

  $('legend').innerHTML = `
    <i class="l-present">출석 <b>${p}</b></i>
    <i class="l-late">지각 <b>${l}</b></i>
    <i class="l-absent">결석 <b>${a}</b></i>
    <i class="l-none">미체크 <b>${none<0?0:none}</b></i>`;
}

function render(){
  const teachers = [...new Set(students.map(s => s.grade_class))];
  $('tabs').innerHTML = teachers.map((t,i) =>
    `<button class="tab ${t===teacher?'active':''}" data-i="${i}">${esc(t.replace(' 선생님',''))}</button>`
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ teacher = teachers[+b.dataset.i]; render(); };
  });

  const filtered = students.filter(s => s.grade_class === teacher);
  $('list').innerHTML = filtered.map(s =>
    `<div class="card"><span class="name">${esc(s.name)}</span><span class="badge ${s.status||''}">${s.status||'미체크'}</span></div>`
  ).join('');
}

dateInput.onchange = fetchAll;
$('refresh').onclick = fetchAll;
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) fetchAll(); });
setInterval(()=>{ if(!document.hidden) fetchAll(); }, 60000);
fetchAll();
</script>
</body>
</html>
